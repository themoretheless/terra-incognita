<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Age of Wonders · Disciples II · King's Bounty · гексы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0f1722}
.chip{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(15,23,34,.9);color:#edf3ec;font:11px/1.3 'JetBrains Mono',monospace;letter-spacing:.01em;border:1px solid rgba(245,168,102,.55);white-space:nowrap}
.chip b{display:grid;place-items:center;flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:#f5a866;color:#2a1a0e;font-size:11px;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 608px; overflow: hidden; background: #000">
<svg width="960" height="608" style="position: absolute; left: 0; top: 0; display: block">
<defs>
<filter id="shadowBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter>
<filter id="hexEdge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="{{blur}}"></feGaussianBlur></filter>
<filter id="dimSoft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.5"></feGaussianBlur></filter>
</defs>

<image href="{{mapHref}}" x="0" y="0" width="960" height="608" style="filter: {{mapFilter}}"></image>

<g transform="translate(80 464)">
<ellipse cx="16" cy="29" rx="17" ry="4" fill="rgba(0,0,0,.3)" filter="url(#shadowBlur)"></ellipse>
<path d="M3 28L16 6l13 22z" fill="#d6c07a"></path>
<path d="M16 6l13 22H16z" fill="#b89c56"></path>
<path d="M12 28l4-11 4 11z" fill="#3a2a1c"></path>
</g>
<g transform="translate(544 100)">
<ellipse cx="20" cy="62" rx="22" ry="5" fill="rgba(0,0,0,.3)" filter="url(#shadowBlur)"></ellipse>
<path d="M8 60V20h4v-6h5v6h6v-6h5v6h4v40z" fill="#8f8f93"></path>
<path d="M20 20h8v40h-8z" fill="#6f6f76"></path>
<path d="M8 60h24v4H8z" fill="#55555a"></path>
<path d="M17 60V46c0-3 1.5-4 3-4s3 1 3 4v14z" fill="#2b2b30"></path>
</g>

<path d="{{grid}}" stroke="#000" fill="none" opacity="{{gridOpacity}}" style="stroke-width: 1"></path>
<path d="{{dim}}" fill="#0b1020" opacity="{{dimOpacity}}" filter="url(#dimSoft)"></path>
<path d="{{black}}" fill="#000" filter="url(#hexEdge)"></path>
<path d="{{rim}}" stroke="#2a2f3a" fill="none" opacity="{{rimOpacity}}" style="stroke-width: 1.5; stroke-linejoin: round"></path>

<g transform="translate(496 240)">
<ellipse cx="2" cy="16" rx="17" ry="5" fill="rgba(0,0,0,.35)" filter="url(#shadowBlur)"></ellipse>
<path d="M-11 -3c-3-3-6-3-8-1" stroke="#3a2a1c" fill="none" style="stroke-width: 2.4; stroke-linecap: round"></path>
<path d="M-15 2c0-6 5-9 12-9h10c5 0 8 2 10 5l4 3-2 4h-5l-1 8h-4l-1-8h-8l-1 8h-4l-1-8c-5 0-9-3-9-5z" fill="#7a4a22"></path>
<path d="M8 -8l9-7c2 2 2 6 0 8l-6 3z" fill="#7a4a22"></path>
<path d="M-3 -7c0-6 2-9 5-9s5 3 5 9v5h-10z" fill="#5b3f8e"></path>
<circle cx="2" cy="-17" r="4.2" fill="#e8c39e"></circle>
<path d="M-10 -30v32" stroke="#3a2a1c" style="stroke-width: 1.6; stroke-linecap: round"></path>
<path d="M-10 -30c5 1 10 0 15 3c-4 2-10 3-15 6z" fill="#e5b84f"></path>
</g>
</svg>

<sc-if value="{{annotations}}" hint-placeholder-val="{{true}}">
<div class="chip" style="left: 24px; top: 24px"><b>1</b><span>Age of Wonders · пелена по гексам, три состояния, грани чёткие</span></div>
<div class="chip" style="left: 24px; top: 556px"><b>2</b><span>Disciples II · только чёрное и открытое, край мягкий (вариант в Tweaks)</span></div>
<div class="chip" style="left: 236px; top: 292px"><b>3</b><span>Обзор · R = {{radiusHex}} гексов от героя</span></div>
<div class="chip" style="left: 540px; top: 520px"><b>4</b><span>King's Bounty (1990) · карта чёрная, открывается навсегда по ходу</span></div>
</sc-if>

<div style="position: absolute; right: 24px; top: 24px; padding: 10px 14px; background: rgba(15,23,34,.9); color: #edf3ec; border: 1px solid rgba(245,168,102,.55); font: 11px 'JetBrains Mono', monospace; min-width: 160px">
<div style="display: flex; justify-content: space-between; gap: 16px"><span>РАЗВЕДАНО</span><span style="color: #f5a866">31 %</span></div>
<div style="height: 3px; background: #293735; margin-top: 8px"><div style="width: 31%; height: 100%; background: #f5a866"></div></div>
</div>
<div style="position: absolute; right: 8px; bottom: 6px; padding: 3px 7px; background: rgba(15,23,34,.85); color: #9aa99f; font: 10px 'JetBrains Mono', monospace">© OpenStreetMap contributors</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"Age of Wonders · гексы","options":["Age of Wonders · гексы","Disciples II · мягкая пелена"],"section":"Пелена"},"hexR":{"editor":"range","default":24,"min":16,"max":40,"step":2,"unit":"px","section":"Пелена"},"radiusHex":{"editor":"range","default":5,"min":3,"max":8,"step":1,"unit":"гекс","section":"Обзор"},"showGrid":{"editor":"boolean","default":true,"section":"Пелена"},"annotations":{"editor":"boolean","default":true,"section":"Пометки"},"basemap":{"editor":"enum","default":"Перерисованная","options":["Перерисованная","Тайлы OSM"],"section":"Подложка"},"$preview":{"width":960,"height":608}}'>
class Component extends DCLogic {
  hex(cx, cy, r) {
    let d = '';
    for (let k = 0; k < 6; k += 1) {
      const a = Math.PI / 6 + k * Math.PI / 3;
      d += `${k === 0 ? 'M' : 'L'}${(cx + r * Math.cos(a)).toFixed(1)} ${(cy + r * Math.sin(a)).toFixed(1)}`;
    }
    return d + 'z';
  }
  renderVals() {
    const p = this.props;
    const r = p.hexR ?? 24;
    const soft = (p.variant ?? 'Age of Wonders · гексы') === 'Disciples II · мягкая пелена';
    const redrawn = (p.basemap ?? 'Перерисованная') !== 'Тайлы OSM';
    const radiusHex = p.radiusHex ?? 5;
    const Rpx = radiusHex * r * Math.sqrt(3) * 0.92;
    const hero = [496, 240];
    const prev = [[144, 496], [272, 400], [400, 304]];
    const w = Math.sqrt(3) * r;
    const h = 1.5 * r;
    let dim = ''; let black = ''; let grid = ''; let rim = '';
    for (let j = -1; j * h < 608 + h; j += 1) {
      for (let i = -1; i * w < 960 + w; i += 1) {
        const cx = i * w + (j % 2 ? w / 2 : 0);
        const cy = j * h;
        const cell = this.hex(cx, cy, r + 0.6);
        grid += this.hex(cx, cy, r);
        const dCur = Math.hypot(cx - hero[0], cy - hero[1]);
        let dPrev = 1e9;
        prev.forEach((q) => { dPrev = Math.min(dPrev, Math.hypot(cx - q[0], cy - q[1])); });
        if (dCur <= Rpx) continue;
        if (dPrev <= Rpx) { dim += cell; continue; }
        black += cell;
        if (dPrev <= Rpx + w || dCur <= Rpx + w) rim += this.hex(cx, cy, r);
      }
    }
    return {
      dim, black, grid, rim,
      blur: soft ? 10 : 0.6,
      dimOpacity: soft ? 0 : 0.45,
      rimOpacity: soft ? 0 : 0.7,
      gridOpacity: (p.showGrid ?? true) && !soft ? 0.12 : 0,
      radiusHex,
      mapHref: redrawn ? '/_blob/8f335fb238af2166c3de8db3d61e637a' : '/_blob/dbece858813dea5d3bae382438ccd4c3',
      mapFilter: redrawn ? 'none' : 'saturate(1.28) sepia(.18) contrast(1.18)',
      annotations: p.annotations ?? true
    };
  }
}
</script>
</body>
</html>
