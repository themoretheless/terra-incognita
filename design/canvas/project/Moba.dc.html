<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dota 2 · League of Legends · обзор от источников</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0f1722}
.chip{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(15,23,34,.9);color:#edf3ec;font:11px/1.3 'JetBrains Mono',monospace;letter-spacing:.01em;border:1px solid rgba(245,168,102,.55);white-space:nowrap}
.chip b{display:grid;place-items:center;flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:#f5a866;color:#2a1a0e;font-size:11px;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 608px; overflow: hidden; background: #000">
<svg width="960" height="608" style="position: absolute; left: 0; top: 0; display: block">
<defs>
<filter id="shadowBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter>
<filter id="visionSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="{{edgeBlur}}"></feGaussianBlur></filter>
<mask id="fogMask">
<rect width="960" height="608" fill="#fff"></rect>
<g filter="url(#visionSoft)">
<circle cx="496" cy="240" r="{{heroR}}" fill="#000"></circle>
<circle cx="700" cy="420" r="{{wardR}}" fill="#000"></circle>
<circle cx="300" cy="150" r="{{allyR}}" fill="#000"></circle>
</g>
</mask>
</defs>

<image href="{{mapHref}}" x="0" y="0" width="960" height="608" style="filter: {{mapFilter}}"></image>

<g transform="translate(80 464)">
<ellipse cx="16" cy="29" rx="17" ry="4" fill="rgba(0,0,0,.3)" filter="url(#shadowBlur)"></ellipse>
<path d="M3 28L16 6l13 22z" fill="#d6c07a"></path>
<path d="M16 6l13 22H16z" fill="#b89c56"></path>
<path d="M12 28l4-11 4 11z" fill="#3a2a1c"></path>
</g>
<g transform="translate(544 100)">
<ellipse cx="20" cy="62" rx="22" ry="5" fill="rgba(0,0,0,.3)" filter="url(#shadowBlur)"></ellipse>
<path d="M8 60V20h4v-6h5v6h6v-6h5v6h4v40z" fill="#8f8f93"></path>
<path d="M20 20h8v40h-8z" fill="#6f6f76"></path>
<path d="M8 60h24v4H8z" fill="#55555a"></path>
<path d="M17 60V46c0-3 1.5-4 3-4s3 1 3 4v14z" fill="#2b2b30"></path>
</g>

<g mask="url(#fogMask)">
<image href="{{mapHref}}" x="0" y="0" width="960" height="608" style="filter: {{fogFilter}}"></image>
<rect width="960" height="608" fill="#0c1630" opacity="{{fogDepth}}" style="mix-blend-mode: multiply"></rect>
</g>

<circle cx="700" cy="420" r="{{wardR}}" fill="none" stroke="#e5d27a" style="stroke-width: 1.2; stroke-dasharray: 6 8" opacity=".55"></circle>

<g transform="translate(700 420)">
<ellipse cx="0" cy="14" rx="10" ry="3.5" fill="rgba(0,0,0,.35)" filter="url(#shadowBlur)"></ellipse>
<path d="M-2 14V-4h4v18z" fill="#6b4a1e"></path>
<path d="M-11 -6c5-8 17-8 22 0c-5 8-17 8-22 0z" fill="#e5d27a" stroke="#3a2a1c" style="stroke-width: 1.2"></path>
<circle cx="0" cy="-6" r="3.6" fill="#2a3a7a"></circle>
<circle cx="1" cy="-7" r="1.2" fill="#fff"></circle>
</g>

<g transform="translate(496 240)">
<ellipse cx="2" cy="16" rx="17" ry="5" fill="rgba(0,0,0,.35)" filter="url(#shadowBlur)"></ellipse>
<path d="M-11 -3c-3-3-6-3-8-1" stroke="#3a2a1c" fill="none" style="stroke-width: 2.4; stroke-linecap: round"></path>
<path d="M-15 2c0-6 5-9 12-9h10c5 0 8 2 10 5l4 3-2 4h-5l-1 8h-4l-1-8h-8l-1 8h-4l-1-8c-5 0-9-3-9-5z" fill="#7a4a22"></path>
<path d="M8 -8l9-7c2 2 2 6 0 8l-6 3z" fill="#7a4a22"></path>
<path d="M-3 -7c0-6 2-9 5-9s5 3 5 9v5h-10z" fill="#2f8a44"></path>
<circle cx="2" cy="-17" r="4.2" fill="#e8c39e"></circle>
<path d="M-10 -30v32" stroke="#3a2a1c" style="stroke-width: 1.6; stroke-linecap: round"></path>
<path d="M-10 -30c5 1 10 0 15 3c-4 2-10 3-15 6z" fill="#2f8a44"></path>
</g>
<g transform="translate(300 150)">
<ellipse cx="2" cy="16" rx="14" ry="4" fill="rgba(0,0,0,.35)" filter="url(#shadowBlur)"></ellipse>
<path d="M-6 -4h12v14h-3v6h-3v-6h-3v6h-3v-6h-3z" fill="#2f8a44"></path>
<circle cx="0" cy="-9" r="4" fill="#e8c39e"></circle>
<path d="M9 -8v18M9 -8l6 3-6 3z" fill="#2f8a44" stroke="#3a2a1c" style="stroke-width: 1.2"></path>
</g>
<g transform="translate(760 470)">
<ellipse cx="2" cy="16" rx="14" ry="4" fill="rgba(0,0,0,.35)" filter="url(#shadowBlur)"></ellipse>
<path d="M-6 -4h12v14h-3v6h-3v-6h-3v6h-3v-6h-3z" fill="#b8302a"></path>
<circle cx="0" cy="-9" r="4" fill="#e8c39e"></circle>
<path d="M9 -8v18M9 -8l6 3-6 3z" fill="#b8302a" stroke="#3a2a1c" style="stroke-width: 1.2"></path>
</g>
</svg>

<sc-if value="{{annotations}}" hint-placeholder-val="{{true}}">
<div class="chip" style="left: 24px; top: 24px"><b>1</b><span>Туман не чёрный · местность видна всегда, объекты и юниты нет (Dota 2, LoL)</span></div>
<div class="chip" style="left: 24px; top: 300px"><b>2</b><span>Союзник · обзор общий на всю команду</span></div>
<div class="chip" style="left: 236px; top: 292px"><b>3</b><span>Обзор героя · {{heroR}} px, края мягкие {{edgeBlur}} px</span></div>
<div class="chip" style="left: 540px; top: 556px"><b>4</b><span>Вард · свой радиус, враг внутри виден</span></div>
</sc-if>

<div style="position: absolute; right: 24px; top: 24px; padding: 10px 14px; background: rgba(15,23,34,.9); color: #edf3ec; border: 1px solid rgba(245,168,102,.55); font: 11px 'JetBrains Mono', monospace; min-width: 160px">
<div style="display: flex; justify-content: space-between; gap: 16px"><span>ИСТОЧНИКОВ ОБЗОРА</span><span style="color: #f5a866">3</span></div>
<div style="margin-top: 6px; color: #9aa99f">герой · союзник · вард</div>
</div>
<div style="position: absolute; right: 8px; bottom: 6px; padding: 3px 7px; background: rgba(15,23,34,.85); color: #9aa99f; font: 10px 'JetBrains Mono', monospace">© OpenStreetMap contributors</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"edgeBlur":{"editor":"range","default":12,"min":0,"max":30,"step":1,"unit":"px","section":"Туман"},"fogDepth":{"editor":"range","default":0.45,"min":0.1,"max":0.8,"step":0.05,"section":"Туман"},"heroR":{"editor":"range","default":176,"min":80,"max":260,"step":8,"unit":"px","section":"Обзор"},"annotations":{"editor":"boolean","default":true,"section":"Пометки"},"basemap":{"editor":"enum","default":"Перерисованная","options":["Перерисованная","Тайлы OSM"],"section":"Подложка"},"$preview":{"width":960,"height":608}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const redrawn = (p.basemap ?? 'Перерисованная') !== 'Тайлы OSM';
    const base = redrawn ? '' : 'saturate(1.28) sepia(.18) contrast(1.18) ';
    return {
      edgeBlur: p.edgeBlur ?? 12,
      fogDepth: p.fogDepth ?? 0.45,
      heroR: p.heroR ?? 176,
      wardR: 120,
      allyR: 140,
      mapHref: redrawn ? '/_blob/8f335fb238af2166c3de8db3d61e637a' : '/_blob/dbece858813dea5d3bae382438ccd4c3',
      mapFilter: redrawn ? 'none' : base.trim(),
      fogFilter: `${base}saturate(.45) brightness(.5)`,
      annotations: p.annotations ?? true
    };
  }
}
</script>
</body>
</html>
